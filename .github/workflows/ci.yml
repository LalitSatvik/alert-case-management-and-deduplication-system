name: ci

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # conftest._superuser_dsn() honours this; it then bootstraps the
      # acms_owner / app_user roles and the acms_test database on the service
      # container. Redis defaults to redis://localhost:6379/15 (logical DB 15).
      TEST_PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e "backend/.[dev]"
      - name: lint + types
        run: cd backend && ruff check . && black --check . && mypy app scripts
      - name: tests (full suite, incl. infra)
        run: cd backend && python -m pytest -q
      - name: grouping benchmark — structural smoke test
        run: cd backend && python scripts/benchmark.py --dataset scripts/data/benchmark.jsonl --min-f1 0.90 --max-false-merge 0.02
      - name: grouping benchmark — discriminating accuracy gate
        run: cd backend && python scripts/benchmark.py --dataset scripts/data/benchmark_hard.jsonl --min-f1 0.90 --max-false-merge 0.05

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci
      - name: lint + types + tests + build
        run: |
          cd frontend
          npm run lint
          npm run typecheck
          npm run test -- --run
          npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
