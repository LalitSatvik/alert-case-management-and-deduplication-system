# Pinned runtime dependency closure for the ACMS backend.
#
# pyproject.toml holds the ABSTRACT spec (unbounded `>=`); this file is the
# CONCRETE lock the Docker image builds from, so a rebuilt image is reproducible.
# It is the runtime closure only — the dev toolchain (pytest, ruff, black, mypy)
# is NOT listed here; install that with `pip install -e ".[dev]"` for local work.
#
# Regenerate after changing [project.dependencies] in pyproject.toml:
#
#   cd backend
#   python -m venv /tmp/lockenv
#   /tmp/lockenv/bin/pip install --dry-run --ignore-installed --report /tmp/r.json \
#     $(python -c "import tomllib;print(' '.join(repr(d) for d in tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")
#   /tmp/lockenv/bin/python - <<'PY'
#   import json; r=json.load(open('/tmp/r.json'))
#   for i in sorted(r['install'], key=lambda x: x['metadata']['name'].lower()):
#       print(f"{i['metadata']['name']}=={i['metadata']['version']}")
#   PY
#
# (equivalently, `pip freeze` in a venv that has had only `pip install -e .` run).

